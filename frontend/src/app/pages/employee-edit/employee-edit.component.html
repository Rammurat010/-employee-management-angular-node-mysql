<div class="form-box">
  <h2>Edit Employee</h2>

  <p *ngIf="loading">Loading...</p>

  <form *ngIf="loaded" [formGroup]="employeeForm" (ngSubmit)="updateEmployee()">
    <label>Name</label>
    <input type="text" formControlName="name" />
    <small
      *ngIf="
        employeeForm.get('name')?.touched && employeeForm.get('name')?.invalid
      "
    >
      Name is required
    </small>

    <label>Email</label>
    <input type="email" formControlName="email" />
    <small
      *ngIf="
        employeeForm.get('email')?.touched && employeeForm.get('email')?.invalid
      "
    >
      Enter a valid email
    </small>

    <label>Phone</label>
    <input type="text" formControlName="phone" />
    <small
      *ngIf="
        employeeForm.get('phone')?.touched && employeeForm.get('phone')?.invalid
      "
    >
      Enter a valid phone number
    </small>

    <label>Department</label>
    <input type="text" formControlName="department" />

    <label>Salary</label>
    <input type="number" formControlName="salary" />

    <label>Joining Date</label>
    <input type="date" formControlName="joining_date" />

    <label>Status</label>
    <select formControlName="status">
      <option value="Active">Active</option>
      <option value="Inactive">Inactive</option>
    </select>

    <p class="error" *ngIf="error">{{ error }}</p>

    <button type="submit" [disabled]="loading">
      {{ loading ? "Updating..." : "Update Employee" }}
    </button>

    <a routerLink="/employees">Back</a>
  </form>

  <p class="error" *ngIf="!loaded && !loading && error">
    {{ error }}
  </p>
</div>
